---
services:
  ss-ui:
    image: ghcr.io/crowrelay/ss-ui
    container_name: ss-ui
    hostname: "ss-ui"
    volumes:
      - "./db:/app/db"
      - "./cert:/app/cert"
    tty: true
    restart: unless-stopped
    ports:
      - "2095:2095"
      - "2096:2096"
    networks:
      - ss-ui
    entrypoint: "./entrypoint.sh"

networks:
  ss-ui:
    driver: bridge
